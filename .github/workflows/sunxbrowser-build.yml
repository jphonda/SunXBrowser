name: Build SunXBrowser installers
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: win
            arch: x64
          - os: macos-15
            platform: mac
            arch: arm64
          - os: macos-15-intel
            platform: mac
            arch: x64
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: electron
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: electron/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm test
      - run: npm run smoke
      - run: npm run dist -- --${{ matrix.platform }} --${{ matrix.arch }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - run: npm run smoke -- --packaged
      - run: npm run checksums
      - uses: actions/upload-artifact@v4
        with:
          name: SunXBrowser-${{ matrix.platform }}-${{ matrix.arch }}
          path: |
            electron/dist/*.exe
            electron/dist/*.dmg
            electron/dist/*.zip
            electron/dist/SHA256*.txt
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-${{ matrix.platform }}-${{ matrix.arch }}
          path: electron/test-output/
  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: SunXBrowser-*
          path: installers
          merge-multiple: true
      - name: Publish downloadable installers
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v0.1.0-build.${GITHUB_RUN_NUMBER}"
          gh release create "$TAG" installers/* --title "SunXBrowser 0.1.0 build ${GITHUB_RUN_NUMBER}" --prerelease --notes "Windows x64 and macOS Apple Silicon / Intel installers. Cloudflare strict Secure DNS enabled automatically. Initial unsigned preview; Windows SmartScreen/macOS Gatekeeper may show a warning. No Chrome extensions or Google account sync."
