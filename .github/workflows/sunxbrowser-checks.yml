name: SunXBrowser tooling checks
on:
  workflow_dispatch:
  push:
    paths: ['SunXBrowser/**', '.github/workflows/sunxbrowser-*.yml']
  pull_request:
    paths: ['SunXBrowser/**', '.github/workflows/sunxbrowser-*.yml']
permissions:
  contents: read
jobs:
  tooling:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s SunXBrowser/tests -v
